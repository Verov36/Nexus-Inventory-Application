name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nexus
          POSTGRES_PASSWORD: nexus
          POSTGRES_DB: nexus_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nexus"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://nexus:nexus@localhost:5432/nexus_test
      TEST_DATABASE_URL: postgresql://nexus:nexus@localhost:5432/nexus_test
      AUTH_SECRET: ci-only-secret
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx prisma migrate deploy
      # schema.prisma and the migrations must describe the same database.
      - run: PGPASSWORD=nexus psql -h localhost -U nexus -d nexus_test -c "CREATE DATABASE nexus_shadow"
      - run: >-
          npx prisma migrate diff --exit-code
          --from-migrations prisma/migrations
          --to-schema-datamodel prisma/schema.prisma
          --shadow-database-url postgresql://nexus:nexus@localhost:5432/nexus_shadow
      - run: npm audit --omit=dev --audit-level=high
      - run: npm test
      - run: npm run build
